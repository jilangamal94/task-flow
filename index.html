<!DOCTYPE html>
<html lang="en"
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="x-UA-Comptible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Task Flow app</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="container">
        <h2>  Task Flow </h2>
        <div class="input">
            <input class="in" type="text" id="task input" placeholder="input a new task...">
            <button id="addTaskBtn">Add</button>
            <div id="previewBox"></div>
        </div>
        <div class="availabletask">
          <button id="tasks">tasks added</button>
          <button id="donetasks">tasks done</button>
     </div>  
      <div>
        <ul class="taskList"></ul>
      </div> 
      <div>
        <ul class="done"></ul>
      </div>
      <div class="menu">
        <p class="edit">Edit</p>
        <p class="delete">Delete</p>
      </div>
    
    </div>
        
        <script src="main.js"></script>
  </body>
</html>
